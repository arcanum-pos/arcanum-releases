name: Development build

# A development build from main of every component, for installations on
# the development channel (chosen in the bootstrapper, for the platform's
# own installations only). Every 15 minutes it looks whether a component's
# main moved since the last build; only then it tests, builds and publishes
# — a GitHub pre-release v<x.y.z>-dev.<n>, listed in releases-dev.json
# (never in releases.json). The newest 20 stay; older ones are deleted.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Build even when nothing changed'
        type: boolean
        default: false

# Read-only by default; each job asks for what it needs (OpenSSF Scorecard:
# token permissions).
permissions:
  contents: read

jobs:
  dev-build:
    permissions:
      contents: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.changes.outputs.build }}
      version: ${{ steps.version.outputs.version }}
      commits: ${{ steps.changes.outputs.commits }}
    steps:
      # main as it is now, not as it was when this run was triggered: a run
      # that waited for another (the concurrency group) must see the
      # releases-dev.json that one wrote, or it picks the same version.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main

      - name: What main is now, and whether that was built already
        id: changes
        run: |
          echo '{' > built-from.json
          first=1
          for repo in $REPOS; do
            sha=$(git ls-remote "https://github.com/arcanum-pos/$repo.git" refs/heads/main | cut -f1)
            [ $first = 1 ] || echo ',' >> built-from.json
            printf '"%s": "%s"' "$repo" "$sha" >> built-from.json
            first=0
          done
          echo '}' >> built-from.json
          echo "commits=$(node -e "console.log(JSON.stringify(JSON.parse(require('fs').readFileSync('built-from.json','utf8'))))")" >> "$GITHUB_OUTPUT"
          last=$( [ -f releases-dev.json ] && node -e "console.log(JSON.stringify(require('./releases-dev.json').built_from ?? null))" || echo null )
          now=$(node -e "console.log(JSON.stringify(JSON.parse(require('fs').readFileSync('built-from.json','utf8'))))")
          if [ "$last" = "$now" ] && [ "${{ inputs.force }}" != "true" ]; then echo "build=false" >> "$GITHUB_OUTPUT"; echo "Nothing new since the last development build."; else echo "build=true" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        if: steps.changes.outputs.build == 'true'
        with:
          node-version: 24

      - name: Check out the components and the installer at those commits
        if: steps.changes.outputs.build == 'true'
        run: |
          for repo in $REPOS; do
            sha=$(node -e "console.log(require('./built-from.json')['$repo'])")
            git clone --quiet "https://github.com/arcanum-pos/$repo.git" "work/$repo"
            git -C "work/$repo" checkout --quiet "$sha"
          done

      - name: Install
        if: steps.changes.outputs.build == 'true'
        run: |
          npm ci
          for repo in work/*; do (cd "$repo" && npm ci --no-audit --no-fund); done

      # After npm ci: the script imports lib.mjs, which needs its dependencies.
      - name: The version of this build
        id: version
        if: steps.changes.outputs.build == 'true'
        run: |
          v=$(node scripts/next-dev-version.mjs)
          [ -n "$v" ] || { echo "::error::no version"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Building $v"

      - name: Test (a failing test means no build)
        if: steps.changes.outputs.build == 'true'
        run: |
          npm test
          (cd work/arcanum-backend && npm test)
          (cd work/arcanum-frontends && npm test)
          (cd work/arcanum-devicehub && npm test)
          (cd work/arcanum-installer && npm test)
          for repo in arcanum-bff arcanum-devicehub arcanum-mailer arcanum-installer; do (cd "work/$repo" && npm run typecheck); done

      - name: Build
        if: steps.changes.outputs.build == 'true'
        run: node scripts/build-release.mjs --version "${{ steps.version.outputs.version }}" --work work --out dist

      # Anyone can check a downloaded bundle came from this workflow:
      # gh attestation verify <file> -R arcanum-pos/arcanum-releases
      - name: Attest the bundles
        if: steps.changes.outputs.build == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/*'

      - name: Publish
        if: steps.changes.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" dist/* \
            --title "Arcanum ${{ steps.version.outputs.version }} (development build)" \
            --notes-file dist/NOTES.md --prerelease --latest=false

  # Container images of the same commits, for self-hosted installations
  # on the development channel (SELF_HOSTING.md).
  images:
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    needs: dev-build
    if: needs.dev-build.outputs.build == 'true'
    uses: ./.github/workflows/images.yml
    with:
      version: ${{ needs.dev-build.outputs.version }}
      commits: ${{ needs.dev-build.outputs.commits }}

  # Only now in releases-dev.json: an installer offers the build once its
  # images exist too.
  index:
    permissions:
      contents: write
    needs: [dev-build, images]
    if: needs.dev-build.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - name: Add it to releases-dev.json; drop the oldest
        env:
          GH_TOKEN: ${{ github.token }}
          COMMITS: ${{ needs.dev-build.outputs.commits }}
          VERSION: ${{ needs.dev-build.outputs.version }}
        run: |
          npm ci
          printf '%s' "$COMMITS" > built-from.json
          gh release download "v$VERSION" --pattern manifest.json --dir dist
          node scripts/update-index.mjs --index releases-dev.json --keep 20 --built-from built-from.json --removed removed.txt \
            --version "$VERSION" --prerelease true --manifest dist/manifest.json
          while read -r old; do [ -n "$old" ] && gh release delete "v$old" --yes --cleanup-tag || true; done < removed.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases-dev.json
          git commit -m "releases-dev.json: add $VERSION"
          git pull --quiet --rebase
          git push
