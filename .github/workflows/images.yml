# Container images for self-hosting (SELF_HOSTING.md): one per Worker,
# ghcr.io/arcanum-pos/tresjr-<worker>:<version>, for amd64 and arm64 — the
# same code as the Cloudflare bundles, bundled for Node. Called by the
# Release workflow with the exact commits it built; or by hand
# (`gh workflow run images.yml -f version=0.1.70-dev.1`) to try a version.
name: Images

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Image tag, e.g. 0.1.70 or 0.1.70-dev.1'
        required: true
      ref:
        description: 'Git ref of the component repos to build'
        default: main
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      ref:
        type: string
        default: main
      # {"arcanum-bff": "<sha>", …}: the commits the release was built from.
      commits:
        type: string
        default: '{}'

# Read-only by default; each job asks for what it needs (OpenSSF Scorecard:
# token permissions).
permissions:
  contents: read

jobs:
  image:
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        worker: [mailer, devicehub, frontends, backend, bff, installer]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: arcanum-pos/arcanum-${{ matrix.worker }}
          ref: ${{ fromJSON(inputs.commits || '{}')[format('arcanum-{0}', matrix.worker)] || inputs.ref }}

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/arcanum-pos/tresjr-${{ matrix.worker }}:${{ inputs.version }}
          labels: |
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Attest the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/arcanum-pos/tresjr-${{ matrix.worker }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # The Helm chart that installs the installer (charts/tresjr-installer), with
  # this version as its own and as the installer it starts with:
  # oci://ghcr.io/arcanum-pos/charts/tresjr-installer. Only for a release's
  # version: not for a test tag, nor a development build (its installer
  # updates itself; nobody installs one from the chart).
  chart:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    if: ${{ contains(inputs.version, '.') && !contains(inputs.version, '-dev') }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Package and push
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package charts/tresjr-installer --version "${{ inputs.version }}" --app-version "${{ inputs.version }}" --destination out
          # ghcr.io sometimes loses a just-pushed layer ("failed to perform Tag"): try again.
          for attempt in 1 2 3; do helm push "out/tresjr-installer-${{ inputs.version }}.tgz" oci://ghcr.io/arcanum-pos/charts && break; [ $attempt = 3 ] && exit 1; sleep 15; done
