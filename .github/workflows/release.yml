# Builds and publishes an Arcanum release: bundles of all five Workers and
# of the installer (listed apart, as manifest.installer), the frontend assets, database schemas + migrations, license and
# third-party notices, and a manifest with checksums and the exact source
# commit of every component. The installer deploys from these.
#
# Run it from the Actions tab (or `gh workflow run release.yml -f version=0.1.0`).
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, e.g. 0.1.0 (tag becomes v0.1.0)'
        required: true
      ref:
        description: 'Git ref of the component repos to build'
        default: main
      prerelease:
        description: 'Mark as pre-release (not "latest")'
        type: boolean
        default: true

# Read-only by default; each job asks for what it needs (OpenSSF Scorecard:
# token permissions).
permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    outputs:
      commits: ${{ steps.commits.outputs.commits }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Refuse an existing version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ inputs.version }}" >/dev/null 2>&1; then
            echo "::error::Release v${{ inputs.version }} already exists"; exit 1
          fi

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24

      - name: Check out the components and the installer (public repos)
        run: |
          for repo in arcanum-mailer arcanum-devicehub arcanum-frontends arcanum-backend arcanum-bff arcanum-installer; do
            git clone --quiet --depth 1 --branch "${{ inputs.ref }}" "https://github.com/arcanum-pos/$repo.git" "work/$repo"
          done

      - name: Install
        run: |
          npm ci
          for repo in work/*; do (cd "$repo" && npm ci --no-audit --no-fund); done

      - name: Test (a failing test means no release)
        run: |
          npm test
          (cd work/arcanum-backend && npm test)
          (cd work/arcanum-frontends && npm test)
          (cd work/arcanum-devicehub && npm test)
          (cd work/arcanum-installer && npm test)
          for repo in arcanum-bff arcanum-devicehub arcanum-mailer arcanum-installer; do (cd "work/$repo" && npm run typecheck); done

      - name: Build the release
        run: node scripts/build-release.mjs --version "${{ inputs.version }}" --work work --out dist

      - name: The commits it was built from (for the images)
        id: commits
        run: |
          echo "commits=$(for repo in work/arcanum-*; do printf '"%s":"%s",' "$(basename "$repo")" "$(git -C "$repo" rev-parse HEAD)"; done | sed 's/,$//; s/^/{/; s/$/}/')" >> "$GITHUB_OUTPUT"

      # Anyone can check a downloaded bundle came from this workflow:
      # gh attestation verify <file> -R arcanum-pos/arcanum-releases
      - name: Attest the bundles
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/*'

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ inputs.version }}" dist/* \
            --title "Arcanum ${{ inputs.version }}" \
            --notes-file dist/NOTES.md \
            ${{ inputs.prerelease && '--prerelease' || '--latest' }}

  # Container images of the same commits, for self-hosting (SELF_HOSTING.md).
  images:
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    needs: release
    uses: ./.github/workflows/images.yml
    with:
      version: ${{ inputs.version }}
      ref: ${{ inputs.ref }}
      commits: ${{ needs.release.outputs.commits }}

  # Only now in releases.json: an installer offers the release once
  # everything it needs exists — on Kubernetes and Docker, the images too.
  index:
    permissions:
      contents: write
    needs: [release, images]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - name: Add it to releases.json (read by the installer)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm ci
          gh release download "v${{ inputs.version }}" --pattern manifest.json --dir dist
          node scripts/update-index.mjs --version "${{ inputs.version }}" --prerelease "${{ inputs.prerelease }}" --manifest dist/manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases.json
          git commit -m "releases.json: add ${{ inputs.version }}"
          # A development build may have committed releases-dev.json meanwhile.
          git pull --quiet --rebase
          git push
