# Builds and publishes an Arcanum release: bundles of all five Workers,
# the frontend assets, database schemas + migrations, license and
# third-party notices, and a manifest with checksums and the exact source
# commit of every component. The installer deploys from these.
#
# Run it from the Actions tab (or `gh workflow run release.yml -f version=0.1.0`).
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, e.g. 0.1.0 (tag becomes v0.1.0)'
        required: true
      ref:
        description: 'Git ref of the component repos to build'
        default: main
      prerelease:
        description: 'Mark as pre-release (not "latest")'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refuse an existing version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ inputs.version }}" >/dev/null 2>&1; then
            echo "::error::Release v${{ inputs.version }} already exists"; exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check out the components (public repos)
        run: |
          for repo in arcanum-mailer arcanum-devicehub arcanum-frontends arcanum-backend arcanum-bff; do
            git clone --quiet --depth 1 --branch "${{ inputs.ref }}" "https://github.com/arcanum-pos/$repo.git" "work/$repo"
          done

      - name: Install
        run: |
          npm ci
          for repo in work/*; do (cd "$repo" && npm ci --no-audit --no-fund); done

      - name: Test (a failing test means no release)
        run: |
          npm test
          (cd work/arcanum-backend && npm test)
          (cd work/arcanum-frontends && npm test)
          for repo in arcanum-bff arcanum-devicehub arcanum-mailer; do (cd "work/$repo" && npm run typecheck); done

      - name: Build the release
        run: node scripts/build-release.mjs --version "${{ inputs.version }}" --work work --out dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ inputs.version }}" dist/* \
            --title "Arcanum ${{ inputs.version }}" \
            --notes-file dist/NOTES.md \
            ${{ inputs.prerelease && '--prerelease' || '--latest' }}
