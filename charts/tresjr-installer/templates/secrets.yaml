# The installer's state key: random, made once, never changed (it seals the
# installer's state — the generated secrets, ENCRYPTION_KEY among them).
# Kept on `helm uninstall` too, and reused on every upgrade.
{{- $name := printf "%s-key" (include "tresjr-installer.name" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "tresjr-installer.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  INSTALLER_STATE_KEY: {{ if $existing }}{{ index $existing.data "INSTALLER_STATE_KEY" }}{{ else }}{{ randAlphaNum 64 | b64enc }}{{ end }}
---
# The bootstrapper's handoff — the installer empties it once imported, so
# an upgrade doesn't put it back unless it's given again.
{{- $bootstrap := printf "%s-bootstrap" (include "tresjr-installer.name" .) }}
{{- $current := lookup "v1" "Secret" .Release.Namespace $bootstrap }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $bootstrap }}
  labels: {{- include "tresjr-installer.labels" . | nindent 4 }}
type: Opaque
data:
  BOOTSTRAP_CONFIG: {{ if .Values.bootstrapConfig }}{{ .Values.bootstrapConfig | b64enc }}{{ else if $current }}{{ index $current.data "BOOTSTRAP_CONFIG" }}{{ else }}{{ "" | b64enc }}{{ end }}
